name: Falcon
version: "1.0.0"
main: com.h2ph.PrismSurvival
api-version: "1.21"
author: h2ph
folia-supported: true
description: Falcon was tamed by h2ph
depend: [Vault, packetevents]
softdepend: [PlaceholderAPI, WorldEdit, FastAsyncWorldEdit, LuckPerms]

commands:
  shop:
    description: Open the shop GUI
    usage: /<command>
    aliases: []
  shards:
    description: Admin command to manage player shards
    usage: /<command> <give|set|remove> <player> <amount>

  billford:
    description: Open the Billford trade GUI
    usage: /billford [admin]
    permission: prism.billford
    permission-message: You do not have permission to use this command.

  rules:
    description: View the server rules
    usage: /rules
    aliases: []

  media:
    description: View media rank requirements
    usage: /media
    aliases: []

  advisor:
    description: View or edit the advisor book
    usage: /advisor [admin]
    aliases: []

  setspawn:
    description: Set a spawn point
    usage: /setspawn <name>
    aliases: []

  spawn:
    description: Teleport to a spawn
    usage: /spawn [name]
    aliases: []

  warp:
    description: Teleport to a warp point
    usage: /warp <name>
    default: true

  economy:
    description: Manage player balances
    usage: /economy <give|set|remove> <player> <amount>
    permission: prismcore.admin.economy

  baltop:
    description: View the top balances
    usage: /baltop

  balance:
    description: View player balance
    usage: /balance [player]
    aliases: [bal]

  pay:
    description: Pay money to another player
    usage: /pay <player> <amount>

  setafk:
    description: Manage AFK regions
    usage: /setafk <confirm|delete> <region_name>
    permission: prismcore.admin.afk
    permission-message: You do not have permission to use this command.

  update:
    description: Create a server update book to show to the next player
    usage: /update
    permission: emporium.update
    permission-message: You do not have permission to use this command.

  afk:
    description: Open the AFK areas GUI
    usage: /afk

  rtp:
    description: Open the Random Teleport GUI
    usage: /rtp

  offend:
    description: Ban a player with a reason
    permission: prism.admin.offend
    usage: /offend <player> <reason> [duration]
    aliases: [ban]
  unban:
    description: Unban a player
    permission: prism.admin.unban
    usage: /unban <player>
    aliases: [pardon]
  checkban:
    description: Check ban status of a player
    permission: prism.admin.checkban
    usage: /checkban <player/ID>

  # checkhistory:
  #   description: Toggle block interaction history logging
  #   permission: prism.admin.checkhistory
  #   usage: /checkhistory

  whowashere:
    description: Show who was previously in the current chunk
    permission: prism.admin.whowashere
    usage: /whowashere

  checkalt:
    description: Check alternative accounts of a player by IP
    permission: prism.admin.checkalt
    usage: /checkalt <player>

  checkplayers:
    description: List all online players and their current worlds
    permission: prism.admin.checkplayers
    usage: /checkplayers

  checktotem:
    description: Remove totem from a player's offhand
    permission: prism.admin.checktotem
    usage: /checktotem <player>

  key:
    description: Manage crate keys
    permission: prism.admin.key
    usage: /key <give|set|remove|reset> ...

  sus:
    description: Monitor suspicious activity
    permission: prism.admin.sus
    usage: /sus

  gmsp:
    description: Silent spectator mode
    permission: prismsmp.spectator
    usage: /gmsp

  gmc:
    description: Quick creative mode
    permission: prismsmp.creative
    usage: /gmc

  gms:
    description: Quick survival mode
    permission: prismsmp.survival
    usage: /gms

  gma:
    description: Quick adventure mode
    permission: prismsmp.adventure
    usage: /gma

  fly:
    description: Toggle flight mode
    permission: prismsmp.fly
    permission-message: ""
    usage: /fly

  nv:
    description: Toggle night vision
    aliases: [nightvision]
    usage: /nv

  discord:
    description: View the server discord link
    usage: /discord
    aliases: []

  store:
    description: View the server store link
    usage: /store
    aliases: []

  duel:
    description: Manage duel regions and settings
    usage: /duel <player|create|settings>
    permission: prismcore.duel.use
    permission-message: You do not have permission to use this command.

  prismreload:
    description: Reload all plugin configurations
    permission: prism.admin.reload
    aliases: [preload]
    usage: /prismreload

  mute:
    description: Mute a player for a certain duration
    usage: /mute <player> <duration> [reason]
    permission: prismsmp.admin.mute

  unmute:
    description: Unmute a player
    usage: /unmute <player>
    permission: prismsmp.admin.mute

  checkmute:
    description: Check the mute details of a player
    usage: /checkmute <player>
    permission: prismsmp.admin.mute

  ah:
    description: Open the auction house
    usage: /ah <search>
    aliases: []

  auction:
    description: Admin commands for the auction system
    usage: /auction <reload>
    permission: prism.admin.auction
    permission-message: You do not have permission to use this command.

  profile:
    description: View a player's profile
    usage: /profile <playername>
    permission: prism.admin.profile
    permission-message: You do not have permission to use this command.

  maintenance:
    description: Toggle maintenance mode
    usage: /maintenance
    permission: prismcore.maintenance
    permission-message: You do not have permission to use this command.

  redstone:
    description: Open the redstone manager GUI
    usage: /redstone
    permission: prism.redstone.admin

  order:
    description: Open the orders GUI
    usage: /order
    aliases: [orders]

  falcon:
    description: Falcon admin and utility commands
    usage: /falcon <auction|order> [player]
    permission: falcon.use
    permission-message: You do not have permission to use this command.

  announce:
    description: Broadcast an announcement to all players
    usage: /announce <message> [repeat <count>]
    permission: falcon.announce

  tpa:
    description: Request to teleport to another player
    usage: /tpa <player>

  tpahere:
    description: Request another player to teleport to you
    usage: /tpahere <player>

  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept [player]

  tpacancel:
    description: Cancel a sent teleport request
    usage: /tpacancel

  tpadeny:
    description: Deny a teleport request
    usage: /tpadeny [player]

  msg:
    description: Send a private message to a player
    usage: /msg <player> <message>
    aliases: [tell, w, wisper]

  reply:
    description: Reply to the last private message
    usage: /reply <message> or /reply <player> <message>
    aliases: [r]

  tpauto:
    description: Automatically accept teleport requests
    usage: /tpauto

  tp:
    description: Teleport to a player
    usage: /tp <player>
    permission: prismcore.teleport

  settings:
    description: Open the settings GUI
    usage: /settings
    aliases: []

  stats:
    description: View your player statistics
    usage: /stats [player]

  hide:
    description: Hide your nametag overhead and in chat
    usage: /hide
    permission: prism.hidename

  disguise:
    description: Disguise as another player with custom name and skin
    usage: /disguise <playername> [skin] | /disguise off | /disguise list
    permission: prism.disguise
    aliases: [dis]

  bounty:
    description: Manage player bounties
    usage: /bounty [add <player> <amount>]
    aliases: [bounties]

  sell:
    description: Open the sell GUI
    usage: /sell
    aliases: []

  sellhistory:
    description: View your aggregated sell history
    usage: /sellhistory
    aliases: [history]

  worth:
    description: View item prices in a GUI
    usage: /worth
    aliases: []

  echest:
    description: Open your personal ender chest
    usage: /echest
    aliases: [enderchest]
    permission: prismcore.enderchest
    permission-message: ""

  anvil:
    description: Open a virtual anvil
    usage: /anvil
    permission: prism.anvil

  craftingtable:
    description: Open a virtual crafting table
    usage: /craftingtable
    permission: prism.craftingtable

  smithingtable:
    description: Open a virtual smithing table
    usage: /smithingtable
    permission: prism.smithingtable

  minigames:
    description: Transfer to the minigame server
    usage: /minigames
    aliases: []

  invsee:
    description: View another player's inventory
    usage: /invsee <player>
    permission: prism.admin.invsee
    permission-message: You do not have permission to use this command.

  endersee:
    description: View another player's ender chest
    usage: /endersee <player>
    permission: prism.admin.endersee
    permission-message: You do not have permission to use this command.

  home:
    description: Open the homes GUI
    usage: /home
    permission: prismcore.home.use
    default: true

  whereami:
    description: Check where a player is located
    usage: /whereami [player]
    default: true

  vanish:
    description: Toggle your visibility to other players
    usage: /vanish
    permission: prism.admin.vanish

  team:
    description: Manage your team
    usage: /team <subcommand>

  otp:
    description: Teleport to an offline player's last logout location
    usage: /otp <player>
    permission: prismcore.teleport

  tab:
    description: Manage TAB list settings and group rankings
    usage: /tab <reload|refresh|rankings|setranking|toggle|info>
    permission: prism.admin.tab

  ignore:
    description: Ignore a player to block all their requests and messages
    usage: /ignore <player>
    default: true

  unignore:
    description: Unignore a previously ignored player
    usage: /unignore <player>
    default: true

permissions:
  prism.redstone.admin:
    description: Permission to use /redstone admin commands
    default: false
  prism.combat.bypass:
    description: Allows bypassing combat logging restrictions
    default: false
  prism.bypass.combat:
    description: Allows bypassing combat logging restrictions
    default: false
  prismcore.admin.shards:
    description: Allows administration of player shards
    default: op
  prismcore.admin.shop:
    description: Allows administration of the shop
    default: op
  prismcore.admin.economy:
    description: Allows administration of player balances
    default: op
  prismcore.admin.antixray:
    description: Permission to use the /antixray admin command
    default: op
  prism.admin.billford:
    description: Permission to use /billford admin
    default: op
  prism.admin.advisor:
    description: Permission to use /advisor admin
    default: op
  prism.admin.tab:
    description: Permission to manage TAB list settings and group rankings
    default: op
  prism.admin.setspawn:
    description: Permission to use /setspawn
    default: op
  prism.spawn:
    description: Permission to use /spawn
    default: true
  prism.anvil:
    description: Allows opening the virtual anvil
    default: true
  prism.craftingtable:
    description: Allows opening the virtual crafting table
    default: true
  prism.smithingtable:
    description: Allows opening the virtual smithing table
    default: true
  prism.minigames:
    description: Allows transfer to minigame server
    default: true
  prismcore.admin.afk:
    description: Allows administration of AFK regions
    default: op
  prismcore.admin.duel:
    description: Allows administration of duels
    default: op
  prismcore.duel.use:
    description: Allows use of duel requests
    default: true
  prismsmp.creative:
    description: Permission to use /gmc
    default: op
  prismsmp.survival:
    description: Permission to use /gms
    default: op
  prismsmp.adventure:
    description: Permission to use /gma
    default: op
  prismsmp.fly:
    description: Permission to use /fly
    default: op
  prismcore.enderchest:
    description: Permission to use /echest
    default: op
  prismcore.home.3:
    description: Access to home slot 3
    default: op
  prismcore.home.4:
    description: Access to home slot 4
    default: op
  prismcore.home.5:
    description: Access to home slot 5
    default: op
  prism.admin.invsee:
    description: Allows viewing other players' inventories
    default: op
  prism.admin.endersee:
    description: Allows viewing other players' ender chests
    default: op
  prismcore.home.use:
    description: Access to the home system
    default: true
  prism.hidename.see:
    description: Allows seeing real names of hidden players
    default: op
  prismcore.teleport:
    description: Allows use of the custom /tp command
    default: op
  prism.warp:
    description: Permission to use /warp
    default: true
  prism.admin.warps:
    description: Permission to manage warps via /falcon warps
    default: op
